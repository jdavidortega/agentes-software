# CI mínima del método (viene con la plantilla; README §Enforcement, convenciones §Git).
# Reejecuta en el remoto lo que los hooks locales exigen, para que un `--no-verify` no pase:
# el rastro documental, el contrato de cada commit NUEVO, la regresión de los propios hooks
# y la suite del producto. Sin red salvo el checkout; sin credenciales.
#
# Qué commits se validan (política explícita):
#   push          los del evento: before..after. Primer push de una rama (before = 0000…) →
#                 desde la base con la rama por defecto; sin esa base (primera subida del
#                 repositorio) → todo el historial.
#   pull_request  los commits REALES de la rama (base..head); el merge sintético que GitHub
#                 hace en el checkout no es un commit del método: a él solo se le pasa el
#                 doctor y la regresión sobre el árbol integrado.
# Un proyecto "iniciado" es el que declara una fase AHORA o la declaró en CUALQUIER commit del
# historial: lo decide el propio validador documental (`check_docs.sh iniciado`), así un
# commit que borra la fase no puede desactivar el replay que lo rechazaría. Solo la plantilla
# que nunca se inició queda exenta.
name: metodo
on:
  push:
  pull_request:
jobs:
  contrato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # validar_historial necesita el historial completo
      - name: Hooks activos (el doctor lo exige dentro de un repo)
        run: git config core.hooksPath .githooks
      - name: Rastro documental (árbol del checkout; en PR, el árbol integrado)
        run: sh scripts/check_docs.sh
      - name: Contrato de cada commit nuevo
        env:
          EVENTO: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! sh scripts/check_docs.sh iniciado; then
            echo "plantilla nunca iniciada (ningún commit declaró fase): no hay contrato de commits que validar"; exit 0
          fi
          case "$EVENTO" in
            pull_request)
              rango="$PR_BASE..$PR_HEAD" ;;
            push)
              if printf '%s' "$BEFORE" | grep -qE '^0+$'; then
                base=$(git rev-parse --verify -q "origin/$DEFAULT_BRANCH" 2>/dev/null || true)
                if [ -n "$base" ] && [ "$base" != "$AFTER" ]; then rango="$(git merge-base "$base" "$AFTER")..$AFTER"; else rango="$AFTER"; fi
              else
                rango="$BEFORE..$AFTER"
              fi ;;
            *) rango="HEAD" ;;
          esac
          echo "rango: $rango"
          sh scripts/pruebas/validar_historial.sh "$rango"
      - name: Regresión de los hooks
        run: sh scripts/pruebas/regresion.sh
      - name: Regresión de la adopción (copia sin sobreescribir y base del método)
        run: sh scripts/pruebas/regresion-adopcion.sh
      - name: Suite del producto (desde F2)
        run: if [ -f scripts/check.sh ]; then sh scripts/check.sh; else echo "sin scripts/check.sh todavía (llega con el diseño)"; fi
